name: Build IronFront

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Epic's official image. Pulling it requires your GitHub account to be linked
  # to an Epic account (https://www.unrealengine.com/en-US/ue-on-github).
  UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.4.4

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (UE image is huge)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

      - name: Package game
        run: |
          mkdir -p "$PWD/out"
          chmod -R a+rwX "$PWD"
          docker run --rm --user ue4 \
            -v "$PWD":/project -v "$PWD/out":/out \
            "$UE_IMAGE" \
            /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
              -project=/project/IronFront.uproject \
              -noP4 -platform=Linux -clientconfig=Development \
              -build -cook -stage -pak -archive -archivedirectory=/out \
              -utf8output

      - uses: actions/upload-artifact@v4
        with:
          name: IronFront-Linux
          path: out/

  # Windows build: needs a self-hosted Windows runner that has UE 5.4 installed
  # (GitHub-hosted runners cannot fit the engine). Run manually from the Actions tab.
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, unreal]
    steps:
      - uses: actions/checkout@v4
      - name: Package game
        shell: cmd
        run: >
          "%UE_ROOT%\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun
          -project="%GITHUB_WORKSPACE%\IronFront.uproject"
          -noP4 -platform=Win64 -clientconfig=Development
          -build -cook -stage -pak -archive -archivedirectory="%GITHUB_WORKSPACE%\out"
      - uses: actions/upload-artifact@v4
        with:
          name: IronFront-Win64
          path: out/
