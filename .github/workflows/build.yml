name: Build IronFront

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
          ls ~/.local/share/godot/export_templates/

      - name: Import project
        run: godot --headless --import || true

      - name: Smoke test (8 bots, simulated match)
        run: |
          godot --headless --path . --script tests/smoke.gd 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          if grep -q "SCRIPT ERROR" smoke.log; then exit 1; fi

      - name: Autotest (boots menu, starts a match, exercises HUD and input)
        run: |
          timeout 90 godot --headless --path . -- --autotest 2>&1 | tee auto.log || true
          grep -q "AUTOTEST OK" auto.log
          grep -q "main_visible=true" auto.log
          if grep -q "SCRIPT ERROR" auto.log; then exit 1; fi

      - name: Visual check (software OpenGL, takes screenshots of every screen)
        continue-on-error: true
        run: |
          apt-get update -qq
          apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2 libpulse0 > /dev/null
          mkdir -p shots
          SHOT_DIR=$PWD/shots LIBGL_ALWAYS_SOFTWARE=1 timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 --resolution 1280x720 -- --autotest 2>&1 | tee vis.log || true
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn

      - name: Export Windows
        run: |
          mkdir -p build/windows build/linux
          godot --headless --verbose --export-release "Windows Desktop" build/windows/IronFront.exe
          test -f build/windows/IronFront.exe

      - name: Export Linux
        run: |
          godot --headless --verbose --export-release "Linux" build/linux/IronFront.x86_64
          test -f build/linux/IronFront.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: IronFront-Windows
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: IronFront-Linux
          path: build/linux/

  # Pushing a tag like v0.2.0 publishes a public GitHub Release with both builds attached.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dl && zip -r ../IronFront-Windows.zip IronFront-Windows && zip -r ../IronFront-Linux.zip IronFront-Linux)
          gh release create "${{ github.ref_name }}" IronFront-Windows.zip IronFront-Linux.zip \
            --repo "${{ github.repository }}" --title "IronFront ${{ github.ref_name }}" --generate-notes
