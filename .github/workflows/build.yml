name: Build IronFront

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
          ls ~/.local/share/godot/export_templates/

      - name: Import project
        run: godot --headless --import || true

      - name: Smoke test (8 bots, simulated match)
        run: |
          godot --headless --path . --script tests/smoke.gd 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          if grep -q "SCRIPT ERROR" smoke.log; then exit 1; fi

      - name: Autotest (boots menu, starts a match, exercises HUD and input)
        run: |
          timeout 90 godot --headless --path . -- --autotest 2>&1 | tee auto.log || true
          grep -q "AUTOTEST OK" auto.log
          grep -q "main_visible=true" auto.log
          if grep -q "SCRIPT ERROR" auto.log; then exit 1; fi

      - name: Export Windows
        run: |
          mkdir -p build/windows build/linux
          godot --headless --verbose --export-release "Windows Desktop" build/windows/IronFront.exe
          test -f build/windows/IronFront.exe

      - name: Export Linux
        run: |
          godot --headless --verbose --export-release "Linux" build/linux/IronFront.x86_64
          test -f build/linux/IronFront.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: IronFront-Windows
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: IronFront-Linux
          path: build/linux/
